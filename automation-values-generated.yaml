       *   acceptance/data/payment.json      — selectedTenderMethod
       *   .env                       — APP_URL, POS_USERNAME, POS_PASSWORD
       *
       * HOW TO RUN:
       *   npm run test:e2e -- --tags "@nvpos-e2e"
       *
       * REPORTS:
