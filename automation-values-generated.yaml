      function cpuSnapshot(): CpuSnapshot[] {
        return cpus().map(c => {
          const t = Object.values(c.times).reduce((a, b) => a + b, 0);
          return { idle: c.times.idle, total: t };
        });
      }
      
      function cpuPercent(before: CpuSnapshot[], after: CpuSnapshot[]): number {
        const pcts = before.map((b, i) => {
          const idleDiff  = after[i].idle  - b.idle;
          const totalDiff = after[i].total - b.total;
          return totalDiff === 0 ? 0 : (1 - idleDiff / totalDiff) * 100;
        });
        return Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
      }
      
      // ── Module-level state (shared across BeforeAll / Before / After / AfterAll) ──
      
      interface CpuSample { t: number; cpu: number; memUsedMb: number; processRssMb: number; }
      
      interface ScenarioMetric {
        name: string;
        startMs: number;
        endMs: number;
        durationSec: number;
        avgCpu: number;
        peakCpu: number;
        /** CPU % consumed by the Node.js test-runner process only (excludes VS Code, OS, etc.) */
        processCpuPct: number;
        /** RSS of the Node.js test-runner process in MB */
        processRssMb: number;
        /** Browser JS heap used at end of scenario in MB (via CDP) */
        browserJsHeapMb: number;
        /** Browser main-thread task time in ms (via CDP) */
        browserTaskMs: number;
        status: string;
      }
      
      let cpuBefore: CpuSnapshot[]       = [];
      let runStartTime                    = 0;
      const cpuSamples: CpuSample[]       = [];
      let sampleInterval: ReturnType<typeof setInterval>;
      const scenarioMetrics: ScenarioMetric[] = [];
      let scenarioStartMs                 = 0;
      let scenarioStartSnapshot: CpuSnapshot[] = [];
      let currentScenarioName             = '';
      /** process.cpuUsage() snapshot taken at the start of each scenario */
      let procCpuStart: NodeJS.CpuUsage   = { user: 0, system: 0 };
      /** CDP session open for the current scenario — null if unavailable */
      let cdpSession: CDPSession | null   = null;
      /** CDP Performance metric values captured at scenario start */
      let cdpInitMetrics: Record<string, number> = {};
      
      /** Shared browser instance — launched once, reused across all scenarios. */
      let sharedBrowser: Browser;
      
      // ── Hooks ─────────────────────────────────────────────────────────────────────
      
      BeforeAll(async function () {
        const CDP_URL = process.env.CDP_URL;
      
        if (CDP_URL) {
          // ── CDP mode: connect to an already-running browser (e.g. Tauri webview) ──
          // The app must be launched with --remote-debugging-port=<PORT>.
          // Set CDP_URL=http://localhost:<PORT> in your .env to enable this mode.
          // A new browser is NOT launched — Playwright attaches to the existing one.
          console.log(`[hooks] CDP mode: connecting to existing browser at ${CDP_URL}`);
          sharedBrowser = await chromium.connectOverCDP(CDP_URL);
        } else {
          // ── Default mode: launch a new Chromium browser ───────────────────────────
          sharedBrowser = await chromium.launch({
            headless: HEADLESS,
            slowMo:   SLOW_MO,
            args: [
              '--disable-blink-features=AutomationControlled',
              '--start-maximized',
              // Required on Linux/CX7 to run Chromium without root sandbox issues
              ...(IS_LINUX ? ['--no-sandbox', '--disable-setuid-sandbox'] : []),
            ],
          });
        }
      
        cpuBefore    = cpuSnapshot();
        runStartTime = Date.now();
        sampleInterval = setInterval(() => {
          const now = cpuSnapshot();
          const pct = cpuPercent(cpuBefore, now);
          cpuSamples.push({
            t:            Math.round((Date.now() - runStartTime) / 1000),
            cpu:          pct,
            memUsedMb:    Math.round((totalmem() - freemem()) / 1024 / 1024),
            processRssMb: Math.round(process.memoryUsage().rss / 1024 / 1024),
          });
          cpuBefore = now;
        }, 2000);
      });
      
      AfterAll(async function () {
        clearInterval(sampleInterval);
        const finalCpu = cpuSnapshot();
        cpuSamples.push({
          t:            Math.round((Date.now() - runStartTime) / 1000),
          cpu:          cpuPercent(cpuBefore, finalCpu),
          memUsedMb:    Math.round((totalmem() - freemem()) / 1024 / 1024),
          processRssMb: Math.round(process.memoryUsage().rss / 1024 / 1024),
        });
      
        const allPcts    = cpuSamples.map(s => s.cpu);
        const avgCpu     = Math.round(allPcts.reduce((a, b) => a + b, 0) / allPcts.length);
        const peakCpu    = Math.max(...allPcts);
        const minCpu     = Math.min(...allPcts);
        const totalMb    = Math.round(totalmem() / 1024 / 1024);
        const usedMb     = cpuSamples[cpuSamples.length - 1]?.memUsedMb ?? Math.round((totalmem() - freemem()) / 1024 / 1024);
        const peakMemMb  = Math.max(...cpuSamples.map(s => s.memUsedMb));
        const memPct     = Math.round((usedMb / totalMb) * 100);
        const durationSec = Math.round((Date.now() - runStartTime) / 1000);
      
        const metrics = {
          avgCpu, peakCpu, minCpu,
          usedMb, peakMemMb, totalMb, memPct,
          durationSec,
          runStartMs: runStartTime,   // absolute epoch ms at t=0 — used by report to align time-series windows
          coreCount: cpus().length,
          cpuModel:  cpus()[0]?.model ?? 'unknown',
          timeSeries: cpuSamples,
          scenarios:  scenarioMetrics,
        };
      
        mkdirSync('reports/metrics', { recursive: true });
        writeFileSync('reports/metrics/run-metrics.json', JSON.stringify(metrics, null, 2));
      
        await sharedBrowser?.close();
      });
      
      // ── Browser lifecycle ─────────────────────────────────────────────────────────
      
      Before(async function (this: AppWorld, scenario) {
        scenarioStartMs       = Date.now();
        scenarioStartSnapshot = cpuSnapshot();
        procCpuStart          = process.cpuUsage();
        currentScenarioName   = scenario.pickle.name;
      
        if (process.env.CDP_URL) {
          // CDP mode: reuse the existing page from the connected browser
          await this.initCdp(sharedBrowser);
        } else {
          await this.init(sharedBrowser);
        }
      
        // Open a CDP session so we can read browser-process metrics in After
        try {
          cdpSession = await this.context.newCDPSession(this.page);
          await cdpSession.send('Performance.enable');
          const init = await cdpSession.send('Performance.getMetrics') as { metrics: Array<{ name: string; value: number }> };
          cdpInitMetrics = Object.fromEntries(init.metrics.map(m => [m.name, m.value]));
        } catch {
          cdpSession = null;
          cdpInitMetrics = {};
        }
      });
      
      After(async function (this: AppWorld, scenario) {
        if (scenario.result?.status === Status.FAILED) {
          const screenshot = await this.page.screenshot({ fullPage: true, type: 'jpeg', quality: 40 });
          await this.attach(screenshot, 'image/jpeg');
        }
      
        const endMs       = Date.now();
        const endSnap     = cpuSnapshot();
        const scenarioCpu = cpuPercent(scenarioStartSnapshot, endSnap);
      
        // ── Process-specific CPU (Node.js test runner only, excludes VS Code / OS) ─
        const procCpuDiff   = process.cpuUsage(procCpuStart);
        const elapsedUs     = (endMs - scenarioStartMs) * 1000;   // ms → μs
        const processCpuPct = Math.min(100, Math.round((procCpuDiff.user + procCpuDiff.system) / elapsedUs * 100));
        const processRssMb  = Math.round(process.memoryUsage().rss / 1024 / 1024);
      
        // ── Browser-process metrics via CDP ─────────────────────────────────────
        let browserJsHeapMb = 0;
        let browserTaskMs   = 0;
        if (cdpSession) {
          try {
            const final = await cdpSession.send('Performance.getMetrics') as { metrics: Array<{ name: string; value: number }> };
            const finalMap = Object.fromEntries(final.metrics.map(m => [m.name, m.value]));
            browserJsHeapMb = Math.round((finalMap['JSHeapUsedSize'] ?? 0) / 1024 / 1024);
            // TaskDuration is cumulative seconds on main thread; delta = work done this scenario
            const taskDeltaSec = (finalMap['TaskDuration'] ?? 0) - (cdpInitMetrics['TaskDuration'] ?? 0);
            browserTaskMs = Math.round(taskDeltaSec * 1000);
          } catch { /* ignore CDP errors */ }
          cdpSession = null;
        }
      
        // Narrow down time-series to this scenario's window for avg/peak
        const startSec = Math.round((scenarioStartMs - runStartTime) / 1000);
        const endSec   = Math.round((endMs - runStartTime) / 1000);
        const window   = cpuSamples.filter(s => s.t >= startSec && s.t <= endSec).map(s => s.cpu);
        const scenarioAvg  = window.length > 0
          ? Math.round(window.reduce((a, b) => a + b, 0) / window.length)
          : scenarioCpu;
        const scenarioPeak = window.length > 0 ? Math.max(...window) : scenarioCpu;
      
        const durationMs  = endMs - scenarioStartMs;
        const durationSec = (durationMs / 1000).toFixed(1);
      
        // ── Read SLO thresholds from .env (with defaults matching QCOE targets) ───
        const SLO_SCAN     = Number(process.env.SLO_SCAN_MS            ?? 500);
        const SLO_DIALOG   = Number(process.env.SLO_DISCOUNT_DIALOG_MS ?? 1000);
        const SLO_CHECKOUT = Number(process.env.SLO_CHECKOUT_MS        ?? 4000);
      
        // ── Scenario summary card — visible without clicking into steps ──────────
        const lines: string[] = [
          '╔══════════════════════════════════════════════════╗',
          '║           SCENARIO PERFORMANCE SUMMARY           ║',
          '╚══════════════════════════════════════════════════╝',
          `  Status        : ${scenario.result?.status?.toUpperCase() ?? 'UNKNOWN'}`,
          `  Duration       : ${durationSec}s  (${durationMs} ms)`,
          `  System CPU Avg/Peak : ${scenarioAvg}% / ${scenarioPeak}%  (all processes)`,
          `  Process CPU          : ${processCpuPct}%  (test runner only)`,
          `  Process Memory (RSS) : ${processRssMb} MB  (test runner only)`,
          `  Browser JS Heap      : ${browserJsHeapMb} MB`,
          ...(browserTaskMs > 0 ? [`  Browser Task Time    : ${browserTaskMs}ms  (main thread)`] : []),
        ];
      
        // Scan timings (populated by cycling scan step)
        if (this.scanTimings && this.scanTimings.length > 0) {
          const avg = Math.round(this.scanTimings.reduce((a, b) => a + b, 0) / this.scanTimings.length);
          const max = Math.max(...this.scanTimings);
          const min = Math.min(...this.scanTimings);
          const slowCount = this.scanTimings.filter(t => t > SLO_SCAN).length;
          lines.push(`  Items scanned  : ${this.scanTimings.length}`);
          lines.push(`  Scan avg/min/max: ${avg}ms / ${min}ms / ${max}ms  (SLO: ${SLO_SCAN}ms)`);
          lines.push(`  Scans > SLO    : ${slowCount} / ${this.scanTimings.length}  ${slowCount === 0 ? '✅' : '⚠️'}`);
        }
      
        // Discount dialog timing
        if (this.discountDialogStart > 0 && this.discountDialogEnd > 0) {
          const dialogMs = this.discountDialogEnd - this.discountDialogStart;
          lines.push(`  Discount dialog: ${dialogMs}ms  (SLO: ${SLO_DIALOG}ms)  ${dialogMs <= SLO_DIALOG ? '✅' : '⚠️ exceeded'}`);
        }
      
        // Total perf timer (if explicitly started in perf scenarios)
        if (this.perfTimerStart > 0) {
          const perfMs = endMs - this.perfTimerStart;
          lines.push(`  Perf timer     : ${(perfMs / 1000).toFixed(1)}s  (${perfMs} ms)`);
        }
      
        // Only show SLOs in use when this scenario actually measured performance
        const isPerfScenario = (this.scanTimings && this.scanTimings.length > 0)
          || this.perfTimerStart > 0
          || (this.discountDialogStart > 0 && this.discountDialogEnd > 0);
        if (isPerfScenario) {
          lines.push(`  SLOs in use    : scan=${SLO_SCAN}ms  dialog=${SLO_DIALOG}ms  checkout=${SLO_CHECKOUT}ms`);
        }
      
        lines.push('──────────────────────────────────────────────────');
        await this.attach(lines.join('\n'), 'text/plain');
      
        scenarioMetrics.push({
          name:           currentScenarioName,
          startMs:        scenarioStartMs,
          endMs,
          durationSec:    Math.round((endMs - scenarioStartMs) / 1000),
          avgCpu:         scenarioAvg,
          peakCpu:        scenarioPeak,
          processCpuPct,
          processRssMb,
          browserJsHeapMb,
          browserTaskMs,
          status:         scenario.result?.status ?? 'unknown',
        });
      
        await this.teardown();
      });
      
    "acceptance/support/world.ts": |
      import { World, IWorldOptions, setWorldConstructor } from '@cucumber/cucumber';
      import { type Browser, type BrowserContext, type Page } from '@playwright/test';
      import { type CartItem } from '../helpers/PlaywrightUtils.js';
      import { NvposPosPage } from '../pages/NvposPosPage.js';
      import { AppFlows } from '../helpers/AppFlows.js';
      
      // APP_URL must be set in .env — no hardcoded default so environment is always explicit.
      if (!process.env.APP_URL) throw new Error('APP_URL is not set. Add APP_URL=http://... to your .env file.');
      const BASE_URL = process.env.APP_URL;
      
      // Auto-detect environment:
      // - Linux (CX7 hardware): headless=true, no slowMo, extra sandbox flags
      // - Windows (local dev):  headless=false, slowMo for visibility
      // Set SLOW_MO=0 in .env to disable slowMo for performance test runs
      export const IS_LINUX = process.platform === 'linux';
      export const HEADLESS  = process.env.HEADLESS === 'true' || IS_LINUX;
      export const SLOW_MO   = process.env.SLOW_MO !== undefined
        ? Number(process.env.SLOW_MO)
        : IS_LINUX ? 0 : 80;
      
      export class AppWorld extends World {
        context!: BrowserContext;
        page!: Page;
        readonly baseUrl: string = BASE_URL;
      
        /** Page object shared across all steps in a scenario — no per-step re-instantiation. */
        pos!: NvposPosPage;
      
        /** High-level app flows shared across all steps in a scenario. */
        flows!: AppFlows;
      
        /** Accumulates items scanned in the current scenario for cart total validation. */
        cartItems: CartItem[] = [];
      
        /** Items removed via the Delete action — used by the Then step to assert absence from cart. */
        deletedItems: CartItem[] = [];
      
        /** Discount amount (in ¥) applied in the current scenario — used by the discounted totals step. */
        lastDiscountAmount: number = 0;
      
        /** Percentage discount applied in the current scenario — used by the percent-off totals step. */
        lastDiscountPercent: number = 0;
      
        /** Sum of all discounts applied in the current scenario — used by combined discount verification. */
        cumulativeDiscountAmount: number = 0;
      
        // ── Performance timing ──────────────────────────────────────────────────
      
        /** Timestamp (ms) when the performance timer was started via "the performance timer starts". */
        perfTimerStart: number = 0;
      
        /** Timestamp (ms) captured just before the discount dialog is triggered. */
        discountDialogStart: number = 0;
      
        /** Timestamp (ms) captured just after the discount dialog is confirmed. */
        discountDialogEnd: number = 0;
      
        /** Total number of items scanned in this scenario (for throughput calculation). */
        scanCount: number = 0;
      
        /** Per-scan timings (ms) — one entry per enterItemCode call in the cycling scan step. */
        scanTimings: number[] = [];
      
        constructor(options: IWorldOptions) {
          super(options);
        }
      
        /**
         * Creates an isolated browser context and page for this scenario.
         * The shared browser instance is provided by the BeforeAll hook.
         */
        async init(browser: Browser) {
          this.context = await browser.newContext({
            viewport: null,
            locale: 'ja-JP',
            // TLS errors are not suppressed — a certificate issue must be investigated,
            // not silently ignored during test runs.
          });
          this.page  = await this.context.newPage();
          this.pos   = new NvposPosPage(this.page);
          this.flows = new AppFlows(this.page);
        }
      
        /**
         * CDP mode: attach to an existing browser (e.g. Tauri webview).
         * Reuses the first existing page instead of opening a new context.
         * The Tauri app must be running with --remote-debugging-port=<PORT>.
         */
        async initCdp(browser: Browser) {
          // connectOverCDP returns the browser's default context
          const contexts = browser.contexts();
          this.context   = contexts[0] ?? await browser.newContext();
          const pages    = this.context.pages();
          this.page      = pages[0] ?? await this.context.newPage();
          this.pos       = new NvposPosPage(this.page);
          this.flows     = new AppFlows(this.page);
          // Always navigate to APP_URL so each scenario starts from a clean page,
          // regardless of what was open in the browser before the test run.
          await this.page.goto(this.baseUrl);
        }
      
        /** Closes the scenario's browser context — the shared browser stays alive. */
        async teardown() {
          if (process.env.CDP_URL) {
            // CDP mode: do NOT close the context — it belongs to the real browser.
            // Just navigate away so the next scenario starts clean.
            await this.page.goto('about:blank').catch(() => {});
          } else {
            await this.context.close();
          }
        }
      }
      
      setWorldConstructor(AppWorld);
    "run-e2e.js": |
      /**
       * run-e2e.js — Cucumber wrapper that always generates the HTML report,
       * even when one or more scenarios fail (Cucumber exits non-zero).
       *
       * Usage (via npm scripts):
       *   node --env-file=.env run-e2e.js [--tags "@TC-20001"] [...]
       */
      
      import { spawnSync }     from 'child_process';
      import { unlinkSync }    from 'fs';
      
      // ── 1. Pre-clean: remove stale JSON report ────────────────────────────────────
      try { unlinkSync('reports/cucumber-json/cucumber-report.json'); } catch {}
      
      // ── 2. Run Cucumber ───────────────────────────────────────────────────────────
      const cucumberResult = spawnSync(
        process.execPath,
        [
          '--import', 'tsx/esm',
          'node_modules/@cucumber/cucumber/bin/cucumber.js',
          ...process.argv.slice(2),   // forward any extra flags (e.g. --tags)
        ],
        { stdio: 'inherit', env: process.env },
      );
      
      // ── 3. Always generate the report ────────────────────────────────────────────
      const reportResult = spawnSync(
        process.execPath,
        ['generate-report.js'],
        { stdio: 'inherit', env: process.env },
      );
      
      if (reportResult.status !== 0) {
        console.error('⚠  Report generation failed (exit', reportResult.status, ')');
      }
      
      // ── 4. Preserve Cucumber's exit code so CI knows if tests failed ──────────────
      process.exit(cucumberResult.status ?? 1);
    "generate-report.js": |
      // Rich HTML report generator using multiple-cucumber-html-reporter
      // Run after tests: node generate-report.js
      // Output: reports/rich-report/index.html
      
      import { generate } from 'multiple-cucumber-html-reporter';
      import { rmSync, readFileSync, writeFileSync } from 'fs';
      import { resolve as _res, dirname as _dir, extname as _ext } from 'path';
      
      // Always regenerate from scratch so stale data never hides scenarios
      try { rmSync('reports/rich-report', { recursive: true, force: true }); } catch {}
      
      // Read CPU/memory metrics written by AfterAll hook
      let metrics = {
        avgCpu: 'N/A', peakCpu: 'N/A', minCpu: 'N/A',
        usedMb: 'N/A', peakMemMb: 'N/A', totalMb: 'N/A', memPct: 'N/A',
        durationSec: 'N/A', coreCount: 'N/A', cpuModel: 'N/A',
        timeSeries: [], scenarios: [],
      };
      try {
        metrics = JSON.parse(readFileSync('reports/metrics/run-metrics.json', 'utf8'));
      } catch { /* metrics file not yet written — skip */ }
      
      // Pre-compute column maxima for bar scaling
      const _scens = metrics.scenarios ?? [];
      const _maxSysCpuAvg  = Math.max(..._scens.map(s => s.avgCpu   ?? 0), 1);
      const _maxSysCpuPeak = Math.max(..._scens.map(s => s.peakCpu  ?? 0), 1);
      const _maxProcCpu    = Math.max(..._scens.map(s => s.processCpuPct ?? 0), 1);
      const _maxProcRss    = Math.max(..._scens.map(s => s.processRssMb  ?? 0), 1);
      const _maxHeap       = Math.max(..._scens.map(s => s.browserJsHeapMb ?? 0), 1);
      const _maxTask       = Math.max(..._scens.map(s => s.browserTaskMs   ?? 0), 1);
      
      // Use the stored runStartMs (absolute epoch ms for t=0) to map scenario timestamps → time-series seconds.
      // Falls back to a best-effort estimate when running against an older metrics file that lacks runStartMs.
      const runStartEpoch = metrics.runStartMs
        ?? (metrics.timeSeries.length > 0 && _scens.length > 0
            ? _scens[0].startMs - (_scens[0].startMs % 1000) - (metrics.timeSeries[0].t ?? 0) * 1000
            : 0);
      
      const scenarioWindows = _scens.map(s => {
        const relStart = (s.startMs - runStartEpoch) / 1000;
        const relEnd   = (s.endMs   - runStartEpoch) / 1000;
        return metrics.timeSeries.filter(p => p.t >= relStart && p.t <= relEnd);
      });
      
      // Compute overall process-level averages across all scenarios
      const allProcCpu  = _scens.map(s => s.processCpuPct ?? 0).filter(v => v > 0);
      const avgProcCpu  = allProcCpu.length ? Math.round(allProcCpu.reduce((a,b)=>a+b,0)/allProcCpu.length) : 'N/A';
      const peakProcCpu = allProcCpu.length ? Math.max(...allProcCpu) : 'N/A';
      const allRss      = _scens.map(s => s.processRssMb ?? 0).filter(v => v > 0);
      const peakRss     = allRss.length ? Math.max(...allRss) : 'N/A';
      const avgRss      = allRss.length ? Math.round(allRss.reduce((a,b)=>a+b,0)/allRss.length) : 'N/A';
      const allHeap     = _scens.map(s => s.browserJsHeapMb ?? 0).filter(v => v > 0);
      const peakHeap    = allHeap.length ? Math.max(...allHeap) : 'N/A';
      const allTask     = _scens.map(s => s.browserTaskMs ?? 0).filter(v => v > 0);
      const totalTaskMs = allTask.length ? allTask.reduce((a,b)=>a+b,0) : 0;
      
      // Inline bar helper for table cells
      const _tbar = (val, max, color) => val == null
        ? '<span style="color:#475569">N/A</span>'
        : `<div style="white-space:nowrap;font-weight:600">${typeof val === 'number' && val >= 1000 ? val + ' ms' : typeof val === 'number' ? val + (color === '#f59e0b' || color === '#818cf8' ? ' MB' : '%') : val}</div>
           <div class="bar-bg"><div class="bar-fg" style="width:${Math.round((val/max)*100)}%;background:${color}"></div></div>`;
      
      // Build per-scenario CPU table rows (10 columns)
      const scenarioRows = _scens.map((s, i) => {
        const w = scenarioWindows[i] ?? [];
        const sysRamAvg = w.length ? Math.round(w.reduce((a,b)=>a+b.memUsedMb,0)/w.length) : (metrics.usedMb ?? 0);
        const st = (s.status ?? '').toLowerCase();
        return `<tr>
          <td style="max-width:280px;word-break:break-word;font-size:.78rem">${s.name}</td>
          <td><span class="badge ${st}">${s.status}</span></td>
          <td>${s.durationSec}s</td>
          <td class="bar-cell">${_tbar(s.avgCpu,  _maxSysCpuAvg,  '#3b82f6')}</td>
          <td class="bar-cell">${_tbar(s.peakCpu, _maxSysCpuPeak, '#ef4444')}</td>
          <td class="bar-cell">${_tbar(s.processCpuPct ?? null, _maxProcCpu, '#a78bfa')}</td>
          <td class="bar-cell">${_tbar(s.processRssMb  ?? null, _maxProcRss, '#818cf8')}</td>
          <td class="bar-cell">${_tbar(s.browserJsHeapMb ?? null, _maxHeap, '#f59e0b')}</td>
          <td class="bar-cell">${_tbar(s.browserTaskMs   ?? null, _maxTask, '#10b981')}</td>
          <td>${sysRamAvg} MB</td>
        </tr>`;
      }).join('');
      
      // Status badge HTML
      const badge = (status) =>
        `<span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:${status==='PASSED'?'#d1fae5':'#fee2e2'};color:${status==='PASSED'?'#065f46':'#991b1b'}">${status}</span>`;
      
      // Progress bar HTML
      const pbar = (pct, color) =>
        `<div style="height:6px;border-radius:3px;background:#e5e7eb;margin-top:4px"><div style="height:6px;border-radius:3px;background:${color};width:${Math.min(100,pct)}%"></div></div>`;
      
      // Scenario card HTML
      const scenarioCards = (metrics.scenarios ?? []).map((s, i) => {
        const w = scenarioWindows[i] ?? [];
        // Always read CPU/memory stats from the scenario object (same source as comparison table)
        // Window is only used for chart sample slices
