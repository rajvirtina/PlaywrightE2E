        const pos = this.pos;
        await pos.clickStartTransaction();
      });
      
      When('the user scans item {string}', async function (this: AppWorld, itemKey: string) {
        const pos = this.pos;
        const item = transactionData.items[itemKey];
        if (!item) throw new Error(`Unknown item key: "${itemKey}". Valid keys: ${Object.keys(transactionData.items).join(', ')}`);
      
        await pos.enterItemCode(item.itemCode);
      
        // Auto-validate cart totals and attach summary to report.
        // If discounts have already been applied this scenario, use the cumulative-aware
        // method so the expected total accounts for those discounts.
        this.cartItems.push(item);
