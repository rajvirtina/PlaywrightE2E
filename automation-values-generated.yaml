      /**
       * AppFlows
       *
       * Reusable multi-step business flows for the Voyix POS Japan (nvPOS) application.
       * These methods compose multiple Page Object actions into named application journeys
       * that can be shared across ANY feature file — avoiding duplication between step files.
       *
       * Architecture:
       *   Steps  →  AppFlows (multi-step reusable flows)  →  NvposPosPage (locators + single actions)
       *                                                    →  PlaywrightUtils (generic browser utils)
       *
       * When to add a method here:
       *   - The same sequence of steps appears (or will appear) in more than one feature
       *   - The flow spans more than one screen
       *   - You want to describe a business action by name, not by mechanical clicks
       *
       * Usage example in a step file:
       *   import { AppFlows } from '../helpers/AppFlows.js';
       *   const flows = new AppFlows(this.page);
       *   await flows.loginToDashboard();
       *   await flows.completeTransaction('4901234000002', 'giftCard');
       */
      
      import { type Page } from '@playwright/test';
      import { NvposPosPage } from '../pages/NvposPosPage.js';
      
      export class AppFlows {
        private readonly pos: NvposPosPage;
      
        constructor(page: Page) {
          this.pos = new NvposPosPage(page);
        }
      
        // ── Authentication flows ─────────────────────────────────────────────────────
      
        /**
         * Open the POS app and log in.
         * Reuse this as a Background step in any feature that starts on the dashboard.
         *
         * Credentials and URL are read from .env automatically.
         */
        async loginToDashboard(): Promise<void> {
          await this.pos.goto();
          await this.pos.login();
        }
      
        // ── Transaction flows ────────────────────────────────────────────────────────
      
        /**
         * Start a new transaction and scan an item barcode.
         * Reuse whenever a feature needs an item in the cart before its own steps begin.
         *
         * @param itemCode - barcode from transaction.json or any other source
         */
        async startTransactionWithItem(itemCode: string): Promise<void> {
          await this.pos.clickStartTransaction();
          await this.pos.enterItemCode(itemCode);
        }
      
        /**
         * Complete the payment flow: proceed to tender screen → select method → confirm.
         *
         * @param tenderMethodKey - key from payment.json (e.g. 'giftCard', 'cash', 'creditCard')
         */
        async completePayment(tenderMethodKey: string): Promise<void> {
          await this.pos.clickProceedToPayment();
          await this.pos.selectTenderMethod(tenderMethodKey);
          await this.pos.clickConfirmPayment();
        }
      
        /**
         * Full end-to-end transaction from an already-logged-in dashboard state:
         *   Start transaction → scan item → proceed to payment → select tender → confirm.
         *
         * Reuse in any scenario that needs a completed transaction as a precondition.
         *
         * @param itemCode        - barcode (e.g. '4901234000002')
         * @param tenderMethodKey - key (e.g. 'giftCard', 'cash')
         */
        async completeTransaction(itemCode: string, tenderMethodKey: string): Promise<void> {
          await this.startTransactionWithItem(itemCode);
          await this.completePayment(tenderMethodKey);
        }
      
        /**
         * Full journey from app launch to completed transaction and home screen.
         * Useful as a single-call smoke flow in suites that verify end-to-end happy path.
         */
        async fullTransactionJourney(itemCode: string, tenderMethodKey: string): Promise<void> {
          await this.loginToDashboard();
          await this.completeTransaction(itemCode, tenderMethodKey);
          await this.pos.waitForHomeScreen();
        }
      
        // ── Assertion helpers ────────────────────────────────────────────────────────
      
        /** Assert the user is back on the POS home dashboard. */
        async assertOnHomeScreen(): Promise<void> {
          await this.pos.waitForHomeScreen();
        }
      
        // ── Evidence ────────────────────────────────────────────────────────────────
      
        /** Capture a full-page screenshot for report evidence. */
        async screenshot(): Promise<Buffer> {
          return this.pos.screenshot();
        }
      }
    "acceptance/helpers/PlaywrightUtils.ts": |
      /**
       * PlaywrightUtils
       *
       * Generic, app-agnostic Playwright helper methods.
       * Use these in Page Objects or AppActions to avoid repeating boilerplate.
       *
       * All methods are static — import and call directly:
       *   import { PlaywrightUtils } from '../helpers/PlaywrightUtils.js';
       *   await PlaywrightUtils.safeClick(locator);
       */
      
      import { type Locator, type Page, expect } from '@playwright/test';
      import { T, t } from '../config/timeouts.js';
      import { deriveTaxValue } from '../config/taxRates.js';
      
      // Re-export so consumers only need one import
      export { T, t };
      
      // Configure Playwright's assertion timeout once, using the environment-scaled
      // value. All expect().toBeVisible() / .toContainText() etc. calls inherit this
      // unless an explicit timeout is passed as an override.
      expect.configure({ timeout: T[10000] });
      
      export interface CartItem {
        itemCode:    string;
        itemName:    string;
        itemPrice:   number;  // tax-inclusive price (内税)
        taxCategory: string;  // 'standard' (10%) | 'reduced' (8%) — mirrors POS DB tax category
      }
      
      export interface CartTotals {
        subtotal: number;  // 小計  = sum of (itemPrice - taxValue) for all items
        tax:      number;  // 税     = sum of taxValue for all items
        total:    number;  // 合計  = sum of itemPrice for all items
      }
      
      export class PlaywrightUtils {
      
        // ── Navigation ──────────────────────────────────────────────────────────────
      
        /** Navigate to a URL and wait for the network to be idle. */
        static async goto(page: Page, url: string, timeout = T[15000]): Promise<void> {
          await page.goto(url, { waitUntil: 'domcontentloaded' });
          await page.waitForLoadState('networkidle', { timeout }).catch(() => {});
        }
      
        /** Wait until the current URL matches a string or regex. */
        static async waitForUrl(page: Page, pattern: string | RegExp, timeout = T[15000]): Promise<void> {
          await page.waitForURL(pattern, { timeout });
        }
      
        // ── Waiting ─────────────────────────────────────────────────────────────────
      
        /** Assert a locator is visible; throws with a clear message on timeout. */
        static async waitForVisible(locator: Locator, timeout?: number): Promise<void> {
          await expect(locator).toBeVisible(timeout !== undefined ? { timeout } : undefined);
        }
      
        /** Wait for a CSS selector to appear in the DOM and be visible. */
        static async waitForSelector(page: Page, selector: string, timeout = T[10000]): Promise<void> {
          await page.waitForSelector(selector, { state: 'visible', timeout });
        }
      
        /** Returns true if the locator is visible within the timeout, false otherwise. */
        static async isVisible(locator: Locator, timeout = T[3000]): Promise<boolean> {
          return locator.isVisible({ timeout }).catch(() => false);
        }
      
        /** Pause execution for a fixed number of milliseconds (use sparingly). */
        static async pause(ms: number): Promise<void> {
          await new Promise(resolve => setTimeout(resolve, ms));
        }
      
        // ── Interactions ────────────────────────────────────────────────────────────
      
        /**
         * Wait for a locator to be visible then click it.
         * @param force - bypass actionability checks (use only when element is overlaid)
         */
        static async safeClick(locator: Locator, timeout?: number, force = false): Promise<void> {
          await expect(locator).toBeVisible(timeout !== undefined ? { timeout } : undefined);
          await locator.click({ force });
        }
      
        /** Clear a field and type a value, waiting for visibility first. */
        static async fillInput(locator: Locator, value: string, timeout?: number): Promise<void> {
          await expect(locator).toBeVisible(timeout !== undefined ? { timeout } : undefined);
          await locator.clear();
          await locator.fill(value);
        }
      
        /** Select an option in a <select> element by its visible text. */
        static async selectOption(locator: Locator, label: string): Promise<void> {
          await locator.selectOption({ label });
        }
      
        // ── Assertions ──────────────────────────────────────────────────────────────
      
        /** Assert that a locator contains the expected text (case-insensitive). */
        static async assertText(locator: Locator, expected: string | RegExp): Promise<void> {
          await expect(locator).toContainText(expected);
        }
      
        /** Assert a locator is NOT visible. */
        static async assertNotVisible(locator: Locator, timeout?: number): Promise<void> {
          await expect(locator).not.toBeVisible(timeout !== undefined ? { timeout } : undefined);
        }
      
        /** Assert the page URL matches a pattern. */
        static async assertUrl(page: Page, pattern: string | RegExp): Promise<void> {
          await expect(page).toHaveURL(pattern);
        }
      
        // ── Screenshots ─────────────────────────────────────────────────────────────
      
        /** Capture a viewport screenshot and return it as a Buffer. JPEG 15% to keep report size small. */
        static async screenshot(page: Page): Promise<Buffer> {
          return page.screenshot({ type: 'jpeg', quality: 15 });
        }
      
        /** Capture a screenshot of a specific element. */
        static async screenshotElement(locator: Locator): Promise<Buffer> {
          return locator.screenshot({ type: 'jpeg', quality: 15 });
        }
      
        // ── Cart calculation ────────────────────────────────────────────────────────
      
        /**
         * Calculate expected cart totals from an array of CartItems.
         *
         * Tax model: tax-exclusive (外税) — tax is calculated on top of the item price.
         *   taxValue = Math.round(itemPrice × rate / 100)
         *
         * Formula:
         *   subtotal  = 小計 = Σ(itemPrice)           (pre-tax prices)
         *   tax       = 税   = Σ(taxValue)             (rounded per item)
         *   total     = 合計 = subtotal + tax
         *
         * @example
         *   const totals = PlaywrightUtils.calculateCartTotals([
         *     { itemCode: '...', itemName: 'おにぎり 梅',   itemPrice: 111, taxCategory: 'taxable' },
         *   ]);
         *   // tax = round(111 × 8 / 100) = round(8.88) = 9
         *   // totals = { subtotal: 111, tax: 9, total: 120 }
         */
        static calculateCartTotals(items: CartItem[]): CartTotals {
          const subtotal = items.reduce((sum, i) => sum + i.itemPrice, 0);
          const tax      = items.reduce((sum, i) => sum + deriveTaxValue(i.itemPrice, i.taxCategory), 0);
          const total    = subtotal + tax;
          return { subtotal, tax, total };
        }
      }
