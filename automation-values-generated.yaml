    "acceptance/config/taxRates.ts": |
      /**
       * Tax rate configuration — mirrors the POS database tax category settings.
       *
       * Tax is calculated tax-exclusive (外税): tax is added on top of the item price.
       *   taxValue = Math.round(itemPrice × rate / 100)
       *
       * To change the rate: update the value here — all test data recalculates automatically.
       */
      export const TAX_RATES: Record<string, number> = {
        taxable: 8,  // 軽減税率 8% — food and non-alcoholic beverages
      } as const;
      
      export type TaxCategory = keyof typeof TAX_RATES;
      
      /**
       * Calculate the tax amount for a pre-tax item price.
       * Formula: Math.round(itemPrice × rate / 100)
       */
      export function deriveTaxValue(itemPrice: number, taxCategory: string): number {
        const rate = TAX_RATES[taxCategory];
        if (rate === undefined) {
          throw new Error(
            `Unknown taxCategory: "${taxCategory}". Valid values: ${Object.keys(TAX_RATES).join(', ')}`
          );
        }
        return Math.round(itemPrice * rate / 100);
      }
    "acceptance/config/timeouts.ts": |
      /**
       * Pre-scaled timeout lookup for the Voyix POS test framework.
       *
       * TIMEOUT_SCALE is resolved automatically:
       *   - Windows (local dev)  → scale = 1  (fast machine, no multiplier)
       *   - Linux  (CX7 hardware) → scale = 3  (slower hardware, triple every timeout)
       *
       * Override at any time by setting TIMEOUT_SCALE in .env, e.g. TIMEOUT_SCALE=2
       *
       * Usage:
       *   import { T } from '../config/timeouts.js';
       *   await safeClick(btn, T[10000]);   // 10 000 ms on Windows, 30 000 ms on CX7
       */
      
      const IS_HARDWARE = process.platform === 'linux';
      
      const SCALE = process.env.TIMEOUT_SCALE !== undefined
        ? Math.max(0.1, Number(process.env.TIMEOUT_SCALE))  // explicit override wins
        : IS_HARDWARE ? 3 : 1;                               // auto-detect by platform
      
      const s = (ms: number): number => Math.round(ms * SCALE);
      
      export const T = {
          50:  s(50),
         100:  s(100),
         200:  s(200),
         500:  s(500),
        1000:  s(1000),
        2000:  s(2000),
        3000:  s(3000),
        5000:  s(5000),
        8000:  s(8000),
       10000:  s(10000),
       15000:  s(15000),
       20000:  s(20000),
       30000:  s(30000),
       60000:  s(60000),
      } as const;
      
      /** Scale a one-off value (for dynamic/computed timeouts). */
      export const t = s;
