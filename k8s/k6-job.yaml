# ─────────────────────────────────────────────────────────────────────────────
# k8s/k6-job.yaml
#
# Kubernetes Job to run k6 load tests against nvpos-cart inside the cluster.
#
# Deploy:
#   JOB_FILE=k6-job.yaml ./k8s/deploy.sh
#
# Or directly:
#   kubectl apply -f k8s/k6-job.yaml -n nvposs
#   kubectl logs -f job/voyix-pos-k6-load -n nvposs
#
# Stages (set STAGE env var):
#   smoke  — 1 VU, 1 min  (quick sanity)
#   load   — ramp to 10 VUs, 9 min  (default, realistic store load)
#   stress — ramp to 50 VUs (find breaking point)
#   soak   — 10 VUs for 1 hour (memory leak detection)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: voyix-pos-k6-load
  namespace: ${NS}
  labels:
    app: voyix-pos-k6
    env: edge
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app: voyix-pos-k6
        env: edge
    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent

          command: ["k6", "run", "/scripts/load-test.js"]

          env:
            # nvpos-cart Go backend — cross-namespace service URL
            - name: CART_URL
              value: "http://nvpos-cart.nvpos-services.svc.cluster.local:8081"

            # Load profile: smoke | load | stress | soak
            - name: STAGE
              value: "load"

            # k6 output — send metrics to Prometheus via remote write
            # Uncomment if otel-prometheus-collector supports remote write:
            # - name: K6_PROMETHEUS_RW_SERVER_URL
            #   value: "http://otel-prometheus-collector-monitoring.prometheus.svc.cluster.local:9090/api/v1/write"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
            - name: reports
              mountPath: /reports

      volumes:
        # k6 script mounted from a ConfigMap
        - name: k6-scripts
          configMap:
            name: voyix-pos-k6-scripts

        # PVC for storing k6 output (shared with E2E test reports)
        - name: reports
          persistentVolumeClaim:
            claimName: voyix-pos-reports-edge

---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap — bundles the k6 script into the cluster so the Job can use it
# without needing a custom Docker image.
#
# Update the script content here OR rebuild from file:
#   kubectl create configmap voyix-pos-k6-scripts \
#     --from-file=load-test.js=k6/load-test.js \
#     -n nvposs --dry-run=client -o yaml | kubectl apply -f -
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: voyix-pos-k6-scripts
  namespace: ${NS}
  labels:
    app: voyix-pos-k6
data:
  load-test.js: |
    // Content is loaded from k6/load-test.js at deploy time via deploy.sh.
    // Run: kubectl create configmap voyix-pos-k6-scripts \
    //        --from-file=load-test.js=k6/load-test.js \
    //        -n nvposs --dry-run=client -o yaml | kubectl apply -f -
    import http from 'k6/http';
    export default function() { http.get(__ENV.CART_URL + '/health'); }
